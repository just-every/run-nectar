name: Native billing capacity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec vite build
      # Deliberately outside push Verify. This uses the native processor edge
      # and today's explicit consents, never unattended or live qualification.
      - run: timeout 1200 node tests/nectar/job-capacity.mjs
