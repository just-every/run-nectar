name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - id: plan
        run: node scripts/verify-plan.mjs
      - name: Check generated contract documents
        run: node scripts/contract-docs.mjs check
      - name: Check edition source lock freshness
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check

  build:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/pnpm/store
          key: nectar-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm run typecheck
      - run: node scripts/check-locales.mjs
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run build
      - run: pnpm check:deployment-spec
      - run: pnpm exec playwright install chromium
      - run: pnpm run verify
        env:
          NECTAR_BUILD_READY: '1'
          NECTAR_VERIFY_GROUP: build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nectar-worker
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  journeys:
    needs: [plan, build]
    if: needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 25 || 12 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      NECTAR_BUILD_READY: '1'
      NECTAR_RECOVERY_FULL: ${{ inputs.full && '1' || '0' }}
      NECTAR_VERIFY_GROUP: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/pnpm/store
          key: nectar-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nectar-worker
          path: dist/
      - if: matrix.browser
        run: pnpm exec playwright install chromium
      - run: pnpm run verify:app

  verify:
    needs: [plan, build, journeys]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check
        env:
          PLAN: ${{ needs.plan.result }}
          TIER: ${{ needs.plan.outputs.tier }}
          BUILD: ${{ needs.build.result }}
          JOURNEYS: ${{ needs.journeys.result }}
        run: |
          test "$PLAN" = success
          if [ "$TIER" = full ]; then
            test "$BUILD" = success
            test "$JOURNEYS" = success
          else
            test "$TIER" = light
            test "$BUILD" = skipped
            test "$JOURNEYS" = skipped
          fi
