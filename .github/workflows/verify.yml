name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      CI: 'true'
      NECTAR_VERIFY_SHARD: ${{ matrix.shard }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check generated contract documents
        run: node scripts/contract-docs.mjs check
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      # ubuntu-24.04 provides Chromium libraries; the real browser journeys
      # still fail if runtime support is missing. Avoid an unbounded apt mirror.
      - run: pnpm exec playwright install chromium
      - run: pnpm run verify
      - name: Recovery reporting browser journeys
        if: ${{ matrix.shard == 0 }}
        run: |
          node tests/nectar/payment-retries-browser.mjs
          node tests/nectar/payment-retries-browser.mjs churn

      - name: Dunning sequence browser journeys
        if: ${{ matrix.shard == 0 }}
        run: |
          node tests/nectar/dunning-browser.mjs
          node tests/nectar/dunning-browser.mjs custody

      - name: Invoice void and replacement browser proof
        if: ${{ matrix.shard == 0 }}
        run: |
          node tests/nectar/invoice-void-browser.mjs
          node tests/nectar/invoice-void-browser.mjs refunds

      - name: Processor reconciliation journeys
        if: ${{ matrix.shard == 0 }}
        run: |
          node tests/nectar/processor-events.mjs
          node tests/nectar/processor-cash.mjs
          node tests/nectar/processor-events-browser.mjs
          node tests/nectar/processor-events-browser.mjs cash
