name: Nightly acceptance

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '51 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify.yml
    with:
      tier: ${{ github.event_name == 'schedule' && 'nightly' || 'all' }}
      timeout: 25

  stripe-history:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_US_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm run build
      - run: node tests/nectar/stripe-history-sandbox.mjs
